name: Publish to GitHub Pages

# Off until you opt in (a repository setting, so it's yours to change):
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Secrets and variables → Actions → Variables → New variable:
#      PAGES_ENABLED = true
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm run check
        run: npm run check

      # Assemble the local variant, then remove examples from the published copy.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html docs theme _site/
          # The review-file schema is published at the URL its $id names.
          mkdir -p _site/reviews && cp reviews/schema.json _site/reviews/
          touch _site/.nojekyll
          # Private pages ship only as sealed (encrypted) copies; never plaintext or keys.
          if find _site -name '*.private.html' -o -name '.private-keys.json' | grep -q .; then
            echo "::error::plaintext private page or key file in the site"; exit 1
          fi
          # Review comments record which commit the reader was looking at.
          echo "window.BH_BUILD = {\"repo\": \"${GITHUB_REPOSITORY}\", \"commit\": \"${GITHUB_SHA}\", \"dirty\": false, \"builtAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"};" > _site/theme/build.js

      - name: Remove example pages and rebuild published data
        run: node scripts/publish.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
